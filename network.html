<!-- this script is used to auto copy script links coming from yb14 network -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YB14 Copy Helper</title>
</head>
<body style="background: #111; color: #fff; font-family: sans-serif; text-align: center; padding-top: 80px; position: relative; min-height: 100vh; box-sizing: border-box;">

    <h2 id="status">please wait</h2>
    
    <button id="copyBtn" style="padding: 15px 30px; font-size: 18px; background: #28a745; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 20px; display: none;">
        COPY
    </button>

    
    <div style="position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);">
        <a href="https://discord.gg/FJyhP6uTby" target="_blank" style="background: #5865F2; color: #fff; padding: 12px 25px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 15px; display: inline-block;">
            discord
        </a>
    </div>

    <script>
        // names, scripts and status here 1=active
        const scripts = {
            "1": {
                name: "Ragdoll Universe",
                status: 1,
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/YBfourteen/fourteenmenu-roblox/refs/heads/main/ragdoll%20universe/lastest/script.lua"))()'
            },
            "2": {
                name: "Flag Wars",
                status: 1,
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/YBfourteen/fourteenmenu-roblox/refs/heads/main/flagwars/lastest/script.lua"))()'
            },
            "0": {
                name: "test id",
                status: 0,
                code: 'if you see this in your clipboard i wrote something wrong or you fiddled with something'            
        };

        const urlParams = new URLSearchParams(window.location.search);
        const scriptId = urlParams.get('script') || "1";
        const targetData = scripts[scriptId];

        const btn = document.getElementById("copyBtn");
        const statusText = document.getElementById("status");

        if (targetData) {
            if (targetData.status === 1) {
                // Script Aktifse
                statusText.innerText = `current script: ${targetData.name}`;
                btn.style.display = "inline-block";

                btn.onclick = async function() {
                    try {
                        await navigator.clipboard.writeText(targetData.code);
                    } catch (err) {
                        const textarea = document.createElement("textarea");
                        textarea.value = targetData.code;
                        document.body.appendChild(textarea);
                        textarea.select();
                        try {
                            document.execCommand('copy');
                        } catch (e) {}
                        document.body.removeChild(textarea);
                    }

                    btn.disabled = true;
                    btn.style.background = "#555";
                    btn.style.cursor = "default";
                    btn.innerText = "COPIED";

                    let countdown = 3;
                    statusText.innerText = `exiting in ${countdown}...`;

                    let timer = setInterval(() => {
                        countdown--;
                        if (countdown > 0) {
                            statusText.innerText = `exiting in ${countdown}...`;
                        } else {
                            clearInterval(timer);
                            statusText.innerText = "stay safe bro";
                            
                            
                            setTimeout(() => {
                                window.close();
                                
                                setTimeout(() => {
                                    statusText.innerText = "you can close this tab if it did not exit";
                                }, 400);
                            }, 1500);
                        }
                    }, 1000);
                };
            } else {
                
                statusText.innerText = `current script: ${targetData.name}`;
                btn.style.display = "inline-block";
                btn.disabled = true;
                btn.style.background = "#dc3545"; 
                btn.style.cursor = "not-allowed";
                btn.innerText = "DISABLED";

                const errorMsg = document.createElement("p");
                errorMsg.style.color = "#dc3545";
                errorMsg.style.fontWeight = "bold";
                errorMsg.style.marginTop = "15px";
                errorMsg.innerText = "this script is disabled. check discord for more information. you can close this window.";
                document.body.appendChild(errorMsg);
            }
        } else {
            statusText.innerText = "invalid script id";
        }
    </script>

</body>
</html>
